name: desktop

# Desktop installers: Windows (MDoP-Setup-<version>.exe), Linux (MDoP-<version>.AppImage)
# and macOS on Apple Silicon (MDoP-<version>.dmg).
#
# - Run it by hand (Actions → desktop → Run workflow) to get test installers as artifacts.
#   Nothing is published.
# - A version tag (v*) runs it from release.yml, which attaches the files to the GitHub Release.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: linux, os: ubuntu-22.04 }     # older glibc: the AppImage runs on more distributions
          - { name: macos, os: macos-latest }     # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Read the version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/config.py)" >> "$GITHUB_OUTPUT"

      - name: Libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libnss3

      - name: Install
        run: pip install -r requirements.txt -r requirements-desktop.txt -r requirements-dev.txt

      - name: Tests (on this system)
        run: python -m pytest -q

      - name: Build the program (PyInstaller)
        run: pyinstaller packaging/mdop.spec --noconfirm

      # start the packaged program without a window and check that it answers
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MDoP\MDoP.exe -ArgumentList self-test -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: dist/MDoP.app/Contents/MacOS/MDoP self-test
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: dist/MDoP/MDoP self-test

      - name: Installer (Windows, Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" "/DSourceDir=$PWD\dist\MDoP" "/O$PWD\out" packaging\windows\mdop.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build-appimage.sh "${{ steps.v.outputs.version }}" dist out
          APPIMAGE_EXTRACT_AND_RUN=1 "out/MDoP-${{ steps.v.outputs.version }}.AppImage" self-test

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/build-dmg.sh "${{ steps.v.outputs.version }}" dist out

      - uses: actions/upload-artifact@v4
        with:
          name: mdop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
