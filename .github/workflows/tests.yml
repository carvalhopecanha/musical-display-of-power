name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Check JavaScript syntax
        run: node --check app/static/app.js
      - name: Check the installer and the desktop packaging scripts
        run: |
          bash -n install.sh && bash -n instalar.sh
          bash -n packaging/linux/build-appimage.sh && bash -n packaging/macos/build-dmg.sh
      - name: Build the Docker image
        run: docker build -t mdop:test .
