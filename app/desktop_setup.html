<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MDoP</title>
<!-- First run of the desktop app: pick where the library lives. Shown by app/desktop.py, never by the server. -->
<style>
  :root { --bg: #15171A; --panel: #1A1C20; --line: #2A2E33; --text: #EDEBE6; --text-2: #A9A59C; --accent: #F2B544; --on-accent: #1A1408; --danger: #F07A6E; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; }
  main { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 32px; }
  .mark { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--accent);
          color: var(--on-accent); font-weight: 700; letter-spacing: -0.5px; }
  h1 { margin: 18px 0 4px; font-size: 24px; }
  p { margin: 0 0 16px; color: var(--text-2); }
  .path { display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
          font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; word-break: break-all; color: var(--text); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  button { font: inherit; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 13px; margin-top: 16px; }
  .error { color: var(--danger); margin-top: 12px; min-height: 1.6em; }
</style>
</head>
<body>
<main>
  <span class="mark" aria-hidden="true">MDoP</span>
  <h1 data-t="title"></h1>
  <p data-t="intro"></p>
  <code class="path" id="path">…</code>
  <div class="actions">
    <button class="primary" id="go" disabled data-t="start"></button>
    <button id="pick" disabled data-t="pick"></button>
  </div>
  <p class="error" id="error" role="alert"></p>
  <p class="hint" data-t="hint"></p>
</main>
<script>
  const pt = (navigator.language || '').toLowerCase().startsWith('pt');
  const T = {
    title: ['Bem-vindo ao MDoP', 'Welcome to MDoP'],
    intro: ['Onde você quer guardar sua biblioteca? É ali que ficam suas músicas, ideias, capas e o banco de dados.',
            'Where do you want to keep your library? Your songs, ideas, covers and database live there.'],
    start: ['Começar', 'Start'], pick: ['Escolher outra pasta', 'Choose another folder'],
    hint: ['Pode ser uma pasta nova ou uma biblioteca do MDoP que você já tem (por exemplo, copiada do servidor). Seus arquivos nunca são apagados.',
           'It can be a new folder or an MDoP library you already have (copied from the server, for example). Your files are never deleted.'],
    empty: ['Escolha uma pasta.', 'Choose a folder.'],
    not_writable: ['O MDoP não consegue gravar nessa pasta. Escolha outra.', 'MDoP cannot write to this folder. Choose another one.'],
  };
  const t = (k) => T[k][pt ? 0 : 1];
  document.documentElement.lang = pt ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  let chosen = '';
  const $ = (id) => document.getElementById(id);
  const show = (p) => { chosen = p; $('path').textContent = p; $('error').textContent = ''; };
  window.addEventListener('pywebviewready', async () => {
    show(await window.pywebview.api.default_library());
    $('go').disabled = false; $('pick').disabled = false;
  });
  $('pick').addEventListener('click', async () => {
    const p = await window.pywebview.api.pick_folder(chosen);
    if (p) show(p);
  });
  $('go').addEventListener('click', async () => {
    $('go').disabled = true;
    const err = await window.pywebview.api.use_library(chosen);
    if (err) { $('error').textContent = t(err); $('go').disabled = false; return; }
    $('go').textContent = '…';
  });
</script>
</body>
</html>
